# Display name shown in the GitHub Actions tab.
name: Application CI

# Define the GitHub events that start this workflow.
on:

  # Run when a pull request targets main.
  # This checks the destination branch, not the feature branch name.
  pull_request:
    branches:
      - main

    # opened: a new pull request was created.
    # synchronize: new commits were pushed to its feature branch.
    # reopened: a previously closed pull request was reopened.
    types: [opened, synchronize, reopened]

  # Run again when main receives new commits, including a merge.
  push:
    branches:
      - main

# Give the automatic GitHub token permission to read repository code.
# This workflow does not need permission to modify the repository.
permissions:
  contents: read

# Define the jobs in this workflow.
jobs:

  # Internal identifier for our single job.
  test-and-build:

    # Friendly job name displayed in the pull request.
    name: API tests and Docker build

    # GitHub provides a temporary Ubuntu machine for this job.
    runs-on: ubuntu-24.04

    # Stop the job if it runs longer than 15 minutes.
    timeout-minutes: 15

    # Steps execute in order on the same runner.
    steps:

      # STEP 1: Download this repository onto the runner.
      - name: Check out repository

        # Run the reusable checkout action maintained by GitHub.
        uses: actions/checkout@v4

        # Supply settings to that action.
        with:

          # Do not leave Git authentication credentials configured
          # for later commands; this job never pushes code.
          persist-credentials: false

      # STEP 2: Make the required Python version available.
      - name: Set up Python

        # Run GitHub's reusable Python setup action.
        uses: actions/setup-python@v5

        with:

          # Match the Python 3.12 runtime in our Dockerfile.
          python-version: "3.12"

          # Reuse downloaded pip packages between workflow runs.
          # Dependency installation is still required.
          cache: pip

          # Update the cache key when either dependency file changes.
          # The | character starts a multiline text value.
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      # STEP 3: Install runtime libraries and testing tools.
      - name: Install dependencies

        # Run these shell commands from the repository root.
        run: |
          python -m pip install -r app/requirements-dev.txt

      # STEP 4: Check whether installed dependency requirements agree.
      - name: Check dependency compatibility
        run: python -m pip check

      # STEP 5: Execute the API tests and show individual test results.
      - name: Run API tests
        run: python -m pytest app/tests -v

      # STEP 6: Verify that our application can be packaged.
      # Normally, this step is skipped if an earlier step fails.
      - name: Build Docker image

        # Use app/Dockerfile and the repository root as build context.
        # github.sha supplies the commit SHA associated with this run.
        run: |
          docker build \
            --file app/Dockerfile \
            --tag secure-ai-platform-api:${{ github.sha }} \
            .