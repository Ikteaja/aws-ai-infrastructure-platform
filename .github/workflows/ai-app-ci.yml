# Name displayed in the GitHub Actions tab.
name: Application CI

# Events that start this workflow.
on:
  # Run when a pull request targets main or receives new commits.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # Run again after changes enter main.
  push:
    branches:
      - main

# Allow the workflow to read repository code.
permissions:
  contents: read

jobs:
  # Internal job identifier.
  test-and-build:
    name: API tests and Docker build

    # Temporary GitHub-hosted Linux machine.
    runs-on: ubuntu-24.04

    # Limit the total job duration.
    timeout-minutes: 15

    # Steps run sequentially on the same machine.
    steps:
      # STEP 1: Download repository code.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # This job does not need to push changes.
          persist-credentials: false

      # STEP 2: Configure Python and dependency caching.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      # STEP 3: Install application and testing dependencies.
      # requirements-dev.txt should include: -r requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r app/requirements-dev.txt

      # STEP 4: Check installed dependency compatibility.
      - name: Check dependency compatibility
        run: python -m pip check

      # STEP 5: Run the API tests.
      # Neither service needs a running web server.
      - name: Run API and mock model tests
        run: python -m pytest app/tests model_service/tests -v
    
      # STEP 6: Build the image and check for an updated base image.
      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --file app/Dockerfile \
            --tag secure-ai-platform-api:${{ github.sha }} \
            .

      # STEP 7a: Report all serious findings without blocking on findings.
      - name: Report all serious image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: false
          exit-code: "0"

      # STEP 7b: Block serious vulnerabilities with available fixes.
      - name: Block fixable serious image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: true
          exit-code: "1"

      # STEP 8: Start the image built in the previous step.
      - name: Start API container
        run: |
          # Run in the background and expose port 8000 locally.
          docker run -d \
            --name api-smoke-test \
            -p 127.0.0.1:8000:8000 \
            secure-ai-platform-api:${{ github.sha }}

      # STEP 9: Verify that the application responds.
      - name: Test container health
        run: |
          # Retry while the application starts.
          for attempt in {1..15}; do
            # Read the HTTP status; use 000 if the request fails.
            status=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 2 \
              http://127.0.0.1:8000/health) || status=000

            # HTTP 200 means the health check passed.
            if [ "$status" = "200" ]; then
              echo "Container health check passed."
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status; waiting for startup."
            sleep 2
          done

          # Fail the step if all attempts were unsuccessful.
          echo "Container health check failed."
          exit 1

      # STEP 10: Print container logs even if an earlier step failed.
      - name: Show container logs
        if: always()
        run: docker logs api-smoke-test || true

      # STEP 11: Clean up even if an earlier step failed.
      - name: Remove test container
        if: always()
        run: docker rm -f api-smoke-test || true