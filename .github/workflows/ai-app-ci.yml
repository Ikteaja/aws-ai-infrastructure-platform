# Display name in GitHub Actions.
name: Application CI

# Run for pull requests to main and commits entering main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

# The workflow only needs to read repository code.
permissions:
  contents: read

jobs:
  test-and-build:
    # Preserve the existing status-check name.
    name: API tests and Docker build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Allow time to build and scan both images.
    timeout-minutes: 25

    steps:
      # STEP 1: Download the repository.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: Configure Python and cache downloaded packages.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
            model_service/requirements.txt

      # STEP 3: Install dependencies for both test modules.
      - name: Install test dependencies
        id: dependencies
        run: |
          python -m pip install \
            -r app/requirements-dev.txt \
            -r model_service/requirements.txt
          python -m pip check

      # STEP 4: Test the API directly in memory.
      # Outgoing model requests are replaced by the test fixture.
      - name: Test module - API
        run: python -m pytest app/tests -v

      # STEP 5: Test the mock application directly in memory.
      # Run even if API tests failed, provided dependencies installed.
      # A failed API test still makes the overall job fail.
      - name: Test module - Mock model
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest model_service/tests -v
        
      # Test the document loader independently.
      # Temporary files are used; no running services are required.
      - name: Run ingestion document-loader tests
        run: python -m pytest ingestion/tests -v

      # STEP 6: Build the API image from the repository root.
      - name: Build API image
        run: |
          docker build \
            --pull \
            --file app/Dockerfile \
            --tag secure-ai-platform-api:${{ github.sha }} \
            .

      # STEP 7: Build the mock image separately.
      - name: Build mock model image
        run: |
          docker build \
            --pull \
            --file model_service/Dockerfile \
            --tag secure-ai-platform-mock-model:${{ github.sha }} \
            .

      # STEP 8: Report API findings, including those without fixes.
      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: "false"
          exit-code: "0"

      # STEP 9: Report mock findings, including those without fixes.
      - name: Report mock image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-mock-model:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: "false"
          exit-code: "0"

      # STEP 10: Fail for fixable HIGH/CRITICAL API findings.
      - name: Block fixable API vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: "true"
          exit-code: "1"

      # STEP 11: Fail for fixable HIGH/CRITICAL mock findings.
      - name: Block fixable mock vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-ai-platform-mock-model:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: "true"
          exit-code: "1"

      # STEP 12: Create a network for container-to-container requests.
      - name: Create test network
        run: docker network create ai-ci-network

      # STEP 13: Start the mock on that network.
      # Its container name becomes its network hostname.
      # No host port is needed for the mock.
      - name: Start mock model container
        run: |
          docker run -d \
            --name mock-model \
            --network ai-ci-network \
            secure-ai-platform-mock-model:${{ github.sha }}

      # STEP 14: Wait for the mock's HTTP endpoint.
      # Run Python inside the mock container; curl is not required.
      - name: Smoke test - Mock container health
        run: |
          for attempt in {1..15}; do
            if docker exec mock-model python -c \
              "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2); assert r.status == 200"; then
              echo "Mock container health check passed."
              exit 0
            fi

            echo "Attempt $attempt: waiting for mock startup."
            sleep 2
          done

          echo "Mock container health check failed."
          exit 1

      # STEP 15: Start the API on the same network.
      # MODEL_BASE_URL must match the name read by routes.py.
      - name: Start API container
        run: |
          docker run -d \
            --name api-integration-test \
            --network ai-ci-network \
            -p 127.0.0.1:8000:8000 \
            -e MODEL_BASE_URL=http://mock-model:8002 \
            secure-ai-platform-api:${{ github.sha }}

      # STEP 16: Verify the API's own health endpoint.
      # This alone does not prove that /ask can reach the mock.
      - name: Smoke test - API container health
        run: |
          for attempt in {1..15}; do
            status=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 2 \
              http://127.0.0.1:8000/health) || status=000

            if [ "$status" = "200" ]; then
              echo "API container health check passed."
              exit 0
            fi

            echo "Attempt $attempt: waiting for API startup."
            sleep 2
          done

          echo "API container health check failed."
          exit 1

      # STEP 17: Test a real request through both running containers.
      # No monkeypatch or simulated HTTP response is used here.
      - name: Integration test - API calls mock model
        run: |
          python - <<'PY'
          import httpx

          # Send the question to the API's published port.
          question = "What is Kubernetes?"
          response = httpx.post(
              "http://127.0.0.1:8000/ask",
              json={"question": question},
              timeout=10.0,
              trust_env=False,
          )

          # Print useful evidence before checking the result.
          print("HTTP status:", response.status_code)
          print("Response:", response.text)

          # Verify success and the complete expected response.
          assert response.status_code == 200, response.text
          assert response.json() == {
              "question": question,
              "answer": (
                  f"Mock response: received your prompt '{question}'. "
                  "No real AI model is connected."
              ),
              "model": "mock-model-v1",
          }

          print("API-to-mock integration test passed.")
          PY

      # STEP 18: Keep each container's logs in its own visible step.
      - name: Show API container logs
        if: always()
        run: |
          if docker container inspect api-integration-test >/dev/null 2>&1; then
            docker logs api-integration-test
          fi

      - name: Show mock container logs
        if: always()
        run: |
          if docker container inspect mock-model >/dev/null 2>&1; then
            docker logs mock-model
          fi

      # STEP 19: Remove containers before removing their network.
      # Attempt cleanup even when a previous step failed.
      - name: Clean up test containers and network
        if: always()
        run: |
          docker rm -f api-integration-test mock-model || true
          docker network rm ai-ci-network || true

      # Preserve the exact images that passed tests and scanning for the
      # separately permissioned main-branch publisher job.
      - name: Save tested images for publishing
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        run: |
          docker save \
            --output "$RUNNER_TEMP/ecr-images.tar" \
            "secure-ai-platform-api:${GITHUB_SHA}" \
            "secure-ai-platform-mock-model:${GITHUB_SHA}"

      - name: Upload tested images
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecr-images-${{ github.run_id }}
          path: ${{ runner.temp }}/ecr-images.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Report deferred image publishing
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.ECR_PUBLISHER_ROLE_ARN == ''
        run: |
          {
            echo "## ECR publishing deferred"
            echo ""
            echo "Tests, image builds, integration checks and Trivy gates passed."
            echo "Set the ECR_PUBLISHER_ROLE_ARN repository variable after the ECR repositories and publisher role are deployed, then run Application CI manually on main."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Publish tested images to ECR
    needs: test-and-build
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.ECR_PUBLISHER_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested images
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ecr-images-${{ github.run_id }}
          path: image-artifact

      - name: Load and verify tested images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker load --input image-artifact/ecr-images.tar
          docker image inspect \
            "secure-ai-platform-api:${IMAGE_TAG}" \
            "secure-ai-platform-mock-model:${IMAGE_TAG}" > /dev/null

      # Only this main-branch job can request credentials via OIDC.
      - name: Check image publisher role configuration
        env:
          IMAGE_PUBLISHER_ROLE_ARN: ${{ vars.ECR_PUBLISHER_ROLE_ARN }}
        run: |
          if [ -z "$IMAGE_PUBLISHER_ROLE_ARN" ]; then
            echo "::error::Set the ECR_PUBLISHER_ROLE_ARN repository variable to the bootstrap role ARN."
            exit 1
          fi

      - name: Configure AWS credentials for image publishing
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.ECR_PUBLISHER_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: "429496640190"
          role-session-name: ecr-publish-${{ github.run_id }}

      # STEP 21: Confirm both Terraform-created repositories are available.
      - name: Verify ECR repositories
        run: |
          aws ecr describe-repositories \
            --region eu-central-1 \
            --repository-names healthops-dev/api healthops-dev/mock-model \
            --query 'repositories[].{Name:repositoryName,URI:repositoryUri,TagMutability:imageTagMutability,Encryption:encryptionConfiguration.encryptionType}' \
            --output table

      # STEP 22: Push only images that passed tests, integration and Trivy gates.
      # Full commit SHA tags are compatible with the repositories' immutable-tag setting.
      - name: Publish application images to ECR
        env:
          AWS_ACCOUNT_ID: "429496640190"
          AWS_REGION: eu-central-1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"

          publish_or_reuse() {
            local repository="$1"
            local local_image="$2"
            local tag_count

            tag_count="$(aws ecr list-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --filter tagStatus=TAGGED \
              --query "length(imageIds[?imageTag=='${IMAGE_TAG}'])" \
              --output text)"

            if [ "$tag_count" = "0" ]; then
              docker tag "$local_image" "${registry}/${repository}:${IMAGE_TAG}"
              docker push "${registry}/${repository}:${IMAGE_TAG}"
            else
              echo "Immutable tag already exists for ${repository}:${IMAGE_TAG}; reusing it."
            fi

            PUBLISHED_DIGEST="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [[ ! "$PUBLISHED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Could not retrieve a valid image digest for ${repository}:${IMAGE_TAG}."
              return 1
            fi
          }

          publish_or_reuse healthops-dev/api "secure-ai-platform-api:${IMAGE_TAG}"
          api_digest="$PUBLISHED_DIGEST"
          publish_or_reuse healthops-dev/mock-model "secure-ai-platform-mock-model:${IMAGE_TAG}"
          mock_digest="$PUBLISHED_DIGEST"

          {
            echo "## ECR image publishing completed"
            echo ""
            echo "- Commit: \`${IMAGE_TAG}\`"
            echo "- API image: \`${registry}/healthops-dev/api@${api_digest}\`"
            echo "- Mock-model image: \`${registry}/healthops-dev/mock-model@${mock_digest}\`"
            echo ""
            echo "Tags use the full commit SHA and the ECR repositories enforce tag immutability."
          } >> "$GITHUB_STEP_SUMMARY"