# Validate Terraform, generate a plan, and report recorded AWS spending.
# This workflow never applies infrastructure.
name: Terraform Plan - dev

on:
  # Review proposed changes before merging into main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  # Generate a fresh plan after changes reach main.
  # Only this main-branch plan is eligible for manual apply.
  push:
    branches: [main]

  # Allow a fresh plan to be requested manually.
  # Select main when starting this workflow manually.
  workflow_dispatch:

# Default permission: allow repository checkout.
permissions:
  contents: read

# Shared Terraform configuration.
env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  # Terraform reads these as input variables.
  TF_VAR_aws_account_id: "429496640190"
  TF_VAR_aws_region: "eu-central-1"
  TF_VAR_document_bucket_name: "healthops-dev-documents-429496640190"
  TF_VAR_eks_kubernetes_version: "1.35"

jobs:
  # Validate administrative IAM configuration without AWS credentials.
  iam-checks:
    name: Bootstrap IAM checks
    uses: ./.github/workflows/iam-checks.yml
    permissions:
      contents: read

  # JOB 1: Validate and scan configuration without AWS credentials.
  checks:
    name: Format, validate, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # STEP 1: Download the repository.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # STEP 2: Install the selected Terraform version.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # STEP 3: Fail if Terraform files need formatting.
      # This command checks files without changing them.
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      # STEP 4: Install modules and providers without accessing S3 state.
      # Use the committed provider lock file without modifying it.
      - name: Initialize for validation
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false -lockfile=readonly

      # STEP 5: Check Terraform configuration structure.
      - name: Validate Terraform configuration
        working-directory: infrastructure/terraform/environments/dev
        run: terraform validate

      # STEP 6: Block high and critical security findings.
      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform/environments/dev
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      # STEP 7: Install Checkov separately from application dependencies.
      - name: Install Checkov
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov-venv"
          "$RUNNER_TEMP/checkov-venv/bin/python" -m pip install "checkov==3.3.21"

      # STEP 8: Run additional configuration security checks.
      # Failed checks stop this job and prevent planning.
      - name: Scan Terraform with Checkov
        run: |
          "$RUNNER_TEMP/checkov-venv/bin/checkov" \
            --directory "$GITHUB_WORKSPACE/infrastructure/terraform/environments/dev" \
            --framework terraform \
            --download-external-modules true \
            --compact

  # JOB 2: Generate the Terraform plan and report recorded AWS spending.
  plan:
    name: Generate development plan
    needs: [checks, iam-checks]

    # Allow AWS-connected PR plans only for the configured lab owner.
    # Reject fork PRs, bot PRs, and runs started by other users.
    # These checks supplement, but do not replace, restricted AWS permissions.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == vars.TF_APPROVER &&
       github.actor == vars.TF_APPROVER &&
       github.triggering_actor == vars.TF_APPROVER) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

      # Allow GitHub to request temporary AWS credentials through OIDC.
      id-token: write

    # Use the same group in the apply workflow.
    # Prevent simultaneous dev plan and apply jobs.
    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    # Run shell commands from the development Terraform root module.
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/dev

    steps:
      # STEP 1: Check out the exact commit associated with this run.
      # PR runs use GitHub's test-merge commit.
      # Main runs use the commit checked later by the apply workflow.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # STEP 2: Install Terraform on this job's separate runner.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # EKS planning requires both values; the apply workflow re-confirms the CIDR.
      - name: Configure EKS administrator inputs
        env:
          EKS_ADMIN_PUBLIC_IPV4_CIDR: ${{ vars.EKS_ADMIN_PUBLIC_IPV4_CIDR }}
          EKS_ADMIN_IAM_ROLE_ARN: ${{ vars.EKS_ADMIN_IAM_ROLE_ARN }}
        run: |
          if [ -z "$EKS_ADMIN_PUBLIC_IPV4_CIDR" ] || [ -z "$EKS_ADMIN_IAM_ROLE_ARN" ]; then
            echo "::error::Set both EKS_ADMIN_PUBLIC_IPV4_CIDR and EKS_ADMIN_IAM_ROLE_ARN repository variables."
            exit 1
          fi

          administrator_json="$(jq -cn \
            --arg cidr "$EKS_ADMIN_PUBLIC_IPV4_CIDR" \
            --arg role "$EKS_ADMIN_IAM_ROLE_ARN" \
            '{public_ipv4_cidr: $cidr, iam_role_arn: $role}')"
          printf 'TF_VAR_eks_administrator=%s\n' "$administrator_json" >> "$GITHUB_ENV"

      # STEP 3: Verify that the AWS planning role is configured.
      # Store the role ARN as a GitHub repository variable.
      - name: Check planning role configuration
        env:
          PLAN_ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::TF_PLAN_ROLE_ARN is missing. Check repository variables."
            exit 1
          fi

          echo "Planning role ARN is available."

      # STEP 4: Obtain temporary credentials from AWS.
      # The role's trust policy must allow the intended main and PR subjects.
      # No permanent AWS access keys are stored in the repository.
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.TF_VAR_aws_region }}
          allowed-account-ids: ${{ env.TF_VAR_aws_account_id }}
          role-session-name: tf-plan-${{ github.run_id }}

      # STEP 5: Connect to the development state stored in S3.
      - name: Initialize remote state
        run: terraform init -lockfile=readonly

      # STEP 6: Compare configuration with state and current AWS resources.
      # Save a binary plan without applying any changes.
      - name: Create saved plan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/plan-artifact"

          terraform plan \
            -lock-timeout=5m \
            -out="$GITHUB_WORKSPACE/plan-artifact/dev.tfplan"

      # STEP 7: Prepare review evidence and reject destructive changes.
      # Preserve the metadata required by the separate apply workflow.
      - name: Prepare plan summary
        run: |
          # Save a readable plan for review.
          terraform show -no-color \
            "$GITHUB_WORKSPACE/plan-artifact/dev.tfplan" \
            > "$GITHUB_WORKSPACE/plan-artifact/plan.txt"

          # Create temporary JSON for inspecting planned actions.
          # This JSON is not included in uploaded artifacts.
          terraform show -json \
            "$GITHUB_WORKSPACE/plan-artifact/dev.tfplan" \
            > "$RUNNER_TEMP/plan.json"

          # Reject deletions and replacements for this milestone.
          # Replacement actions also contain "delete".
          if jq -e \
            '[.resource_changes[]? |
              select(.change.actions | index("delete"))] |
              length > 0' \
            "$RUNNER_TEMP/plan.json" > /dev/null; then
            echo "::error::Deletion or replacement detected. Review the configuration."
            exit 1
          fi

          # Record integrity information and the source commit.
          cd "$GITHUB_WORKSPACE/plan-artifact"
          sha256sum dev.tfplan > dev.tfplan.sha256
          printf '%s\n' "$GITHUB_SHA" > commit.txt
          printf '%s\n' "$TF_VERSION" > terraform-version.txt

          # Display proposed resource changes in the workflow summary.
          {
            echo "## Development Terraform plan"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Plan run ID: $GITHUB_RUN_ID"
            echo "- Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Environment: dev"
            echo "- No resources were applied."

            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "- Review-only PR plan: cannot be used by the apply workflow."
            else
              echo "- Review plan.txt before requesting manual apply."
            fi

            echo ""
            echo "| Resource | Action |"
            echo "|---|---|"

            jq -r \
              '.resource_changes[]? |
                select(.change.actions != ["no-op"]) |
                "| \(.address) | \(.change.actions | join(", ")) |"' \
              "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      # STEP 8: Report spending already recorded by AWS.
      # This covers the entire account, not only this project's resources.
      # It does not estimate the future cost of the proposed Terraform plan.
      # Cost Explorer API requests incur a charge.
      - name: Report recorded AWS costs
        run: |
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import subprocess
          from decimal import Decimal
          from pathlib import Path

          # AWS treats the end date as exclusive.
          # Report from the start of the month through yesterday in UTC.
          end = dt.datetime.now(dt.timezone.utc).date()
          start = end.replace(day=1)

          # On the first day of a month, report the previous month.
          if start == end:
              start = (end - dt.timedelta(days=1)).replace(day=1)

          # Use this job's temporary AWS credentials.
          # Local profiles such as ai-lab-admin are not used in CI.
          command = [
              "aws", "ce", "get-cost-and-usage",
              "--time-period", f"Start={start},End={end}",
              "--granularity", "MONTHLY",
              "--metrics", "UnblendedCost",
              "--group-by", "Type=DIMENSION,Key=SERVICE",
              "--region", "us-east-1",
              "--output", "json",
              "--no-cli-pager",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
          )

          # Stop the job if AWS cannot provide the spending report.
          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit(result.returncode)

          data = json.loads(result.stdout)
          totals = {}

          estimated = any(
              period.get("Estimated", False)
              for period in data["ResultsByTime"]
          )

          # Aggregate costs by service and currency.
          # Decimal preserves precision for small amounts.
          for period in data["ResultsByTime"]:
              for group in period.get("Groups", []):
                  metric = group["Metrics"]["UnblendedCost"]
                  key = (group["Keys"][0], metric["Unit"])
                  totals[key] = (
                      totals.get(key, Decimal("0"))
                      + Decimal(metric["Amount"])
                  )

          account = os.environ["TF_VAR_aws_account_id"]

          lines = [
              "## Recorded AWS account costs",
              "",
              f"Period: {start} inclusive to {end} exclusive (UTC).",
              f"Scope: entire account {account}, all regions.",
              f"AWS marks these results as estimated: {estimated}.",
              "Billing data may be delayed; this is not the final invoice.",
              "This report does not predict the cost of planned resources.",
              "",
              "| Service | Recorded cost | Currency |",
              "|---|---:|---|",
          ]

          by_currency = {}

          for (service, currency), amount in sorted(totals.items()):
              service = service.replace("|", "/")
              lines.append(
                  f"| {service} | {amount:.4f} | {currency} |"
              )
              by_currency[currency] = (
                  by_currency.get(currency, Decimal("0")) + amount
              )

          if not totals:
              lines.append("| No recorded groups returned | — | — |")

          for currency, amount in sorted(by_currency.items()):
              lines.append(
                  f"| **Total** | **{amount:.4f}** | {currency} |"
              )

          report = "\n".join(lines) + "\n"

          # Store the report with the plan's review files.
          output_directory = (
              Path(os.environ["GITHUB_WORKSPACE"]) / "plan-artifact"
          )
          output_directory.mkdir(parents=True, exist_ok=True)

          (output_directory / "aws-costs.md").write_text(
              report,
              encoding="utf-8",
          )

          # Display the same report in the GitHub Actions summary.
          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("\n" + report)

          print(report)
          PYTHON

      # STEP 9a: Upload PR review reports without the binary apply plan.
      - name: Upload pull-request review reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-pr-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/plan-artifact/plan.txt
            ${{ github.workspace }}/plan-artifact/aws-costs.md
            ${{ github.workspace }}/plan-artifact/commit.txt
          retention-days: 1
          if-no-files-found: error

      # STEP 9b: Publish an apply-eligible artifact only for main runs.
      # Keep the artifact name and metadata expected by terraform-apply.yml.
      - name: Upload saved main plan and AWS spending report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/plan-artifact/
          retention-days: 1
          if-no-files-found: error

      # STEP 10: Remove temporary plan JSON even if an earlier step failed.
      - name: Remove temporary plan JSON
        if: always()
        run: rm -f "$RUNNER_TEMP/plan.json"

  # JOB 3: Provide a single result for the required review checks.
  # Reject failed, skipped, or cancelled jobs.
  # Enforcing this result before merge requires repository protection settings.
  review-gate:
    name: Terraform review gate
    needs: [checks, iam-checks, plan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require successful checks, plan, and AWS spending report
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          IAM_RESULT: ${{ needs.iam-checks.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$IAM_RESULT" != "success" ] || [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Review failed: checks=$CHECKS_RESULT; iam=$IAM_RESULT; plan-and-aws-costs=$PLAN_RESULT."
            echo "Skipped, failed, or cancelled jobs do not satisfy this gate."
            exit 1
          fi

          echo "Validation, security scans, bootstrap IAM checks, Terraform plan and AWS spending report succeeded."
