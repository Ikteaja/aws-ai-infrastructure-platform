apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthops-dev

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=dev
      - MODEL_BASE_URL=http://mock-model.healthops-dev.svc.cluster.local:8002

images:
  - name: secure-ai-platform-api
    newName: 429496640190.dkr.ecr.eu-central-1.amazonaws.com/healthops-dev/api
    digest: sha256:3afa88863aa9ad5f90b5675b55fc2c254f692998b14f20374ddfad98c0fbd147
  - name: secure-ai-platform-mock-model
    newName: 429496640190.dkr.ecr.eu-central-1.amazonaws.com/healthops-dev/mock-model
    digest: sha256:496f154a558970ff59338494fc75b4ccf181ab9e5f936713999a96e823f6febb

replicas:
  - name: secure-ai-api
    count: 1
  - name: mock-model
    count: 1

labels:
  - pairs:
      app.kubernetes.io/part-of: secure-ai-platform
      environment: dev
    includeSelectors: false
