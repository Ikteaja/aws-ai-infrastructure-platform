apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthops-dev

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=dev
      - MODEL_BASE_URL=http://mock-model.healthops-dev.svc.cluster.local:8002

images:
  - name: secure-ai-platform-api
    newName: 429496640190.dkr.ecr.eu-central-1.amazonaws.com/healthops-dev/api
    digest: sha256:1b932c214deacfb3e8ec1b25d0bf20273ea4c021d22f994ecac0fd4a340473d5
  - name: secure-ai-platform-mock-model
    newName: 429496640190.dkr.ecr.eu-central-1.amazonaws.com/healthops-dev/mock-model
    digest: sha256:5147e4a87ee79fabd59d27c52a52859ff2dfbdeb85acaf0a6dc35d7b60f4f0b1

replicas:
  - name: secure-ai-api
    count: 1
  - name: mock-model
    count: 1

labels:
  - pairs:
      app.kubernetes.io/part-of: secure-ai-platform
      environment: dev
    includeSelectors: false
