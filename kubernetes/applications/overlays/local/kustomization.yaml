apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-platform

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=local
      - MODEL_BASE_URL=http://mock-model.ai-platform.svc.cluster.local:8002

images:
  - name: secure-ai-platform-api
    newTag: 0.2.0
  - name: secure-ai-platform-mock-model
    newTag: 0.1.0

replicas:
  - name: secure-ai-api
    count: 2
  - name: mock-model
    count: 1

labels:
  - pairs:
      app.kubernetes.io/part-of: secure-ai-platform
      environment: local
    includeSelectors: false
