apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: healthops-dev
  namespace: argocd
spec:
  description: Deploy the HealthOps dev applications to the existing EKS cluster.
  sourceRepos:
    - https://github.com/Ikteaja/aws-ai-infrastructure-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: healthops-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
